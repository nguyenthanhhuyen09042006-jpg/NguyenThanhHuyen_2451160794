<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Infinite Scroll Gallery</title>
    <style>
        #gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        @media (max-width: 768px) { #gallery { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { #gallery { grid-template-columns: 1fr; } }
        img { width: 100%; height: auto; border-radius: 8px; }
        .spinner { text-align: center; font-size: 20px; font-weight: bold; padding: 20px; display: none; }
    </style>
</head>
<body>
    <h2>Thư viện ảnh (Cuộn vô cực)</h2>
    <div id="gallery"></div>
    <div id="spinner" class="spinner">⏳ Đang tải thêm ảnh...</div>
    <div id="load-trigger" style="height: 20px;"></div> <script src="script.js"></script>
</body>
</html>
