<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="grid-container">
        <header class="header">HEADER (Full Width)</header>
        
        <section class="hero">
            <h2>HERO BANNER - SẢN PHẨM NỔI BẬT ĐƯỢC SPAN 2</h2>
        </section>
        
        <aside class="sidebar">
            <h3>Bộ lọc sản phẩm</h3>
            <label><input type="checkbox"> Laptop Gaming</label><br>
            <label><input type="checkbox"> MacBook</label><br>
            <label><input type="checkbox"> Phụ kiện</label>
        </aside>
        
        <main class="main-content">
            <div class="inner-card">Card 1</div>
            <div class="inner-card">Card 2</div>
            <div class="inner-card">Card 3</div>
            <div class="inner-card">Card 4</div>
            <div class="inner-card">Card 5</div>
            <div class="inner-card">Card 6</div>
        </main>
        
        <aside class="ads">
            <div class="ads-box">BANNER QC</div>
        </aside>
        
        <footer class="footer">FOOTER (Full Width)</footer>
    </div>

</body>
</html>
